# ──────────────────────────────────────────────────────────────
# Netlify configuration for OpenForm Frontend
# Proxies API calls to Vercel (serverless functions) and
# serves the Vite SPA from dist/.
#
# Required Netlify Environment Variables (set in dashboard):
#   VITE_FIREBASE_API_KEY
#   VITE_FIREBASE_AUTH_DOMAIN
#   VITE_FIREBASE_PROJECT_ID
#   VITE_FIREBASE_STORAGE_BUCKET
#   VITE_FIREBASE_MESSAGING_SENDER_ID
#   VITE_FIREBASE_APP_ID
#   VITE_GOOGLE_IMPORT_API_URL   → Java backend URL (e.g. https://openform-import.onrender.com)
#   VERCEL_API_URL               → Vercel deployment URL (e.g. https://openform.vercel.app)
# ──────────────────────────────────────────────────────────────

[build]
  command   = "npm install && npm run build"
  publish   = "dist"

# Ignore builds for the java-backend directory changes
[build.ignore]
  command = "git diff --quiet HEAD^ HEAD -- java-backend/"

# ── API Proxies ──────────────────────────────────────────────
# All /api/* requests are reverse-proxied (200 rewrite) to Vercel.
# The browser sees them as same-origin — no CORS issues.
# Status 200 = invisible proxy (not a redirect).

# Google OAuth auth-url (Vercel serverless)
[[redirects]]
  from   = "/api/google/auth-url"
  to     = ":VERCEL_API_URL/api/google/auth-url"
  status = 200
  force  = true

# Google OAuth callback (Vercel serverless)
[[redirects]]
  from   = "/api/google/callback"
  to     = ":VERCEL_API_URL/api/google/callback"
  status = 200
  force  = true

# Unlock endpoint
[[redirects]]
  from   = "/api/unlock"
  to     = ":VERCEL_API_URL/api/unlock"
  status = 200
  force  = true

# Create form
[[redirects]]
  from   = "/api/create-form"
  to     = ":VERCEL_API_URL/api/create-form"
  status = 200
  force  = true

# Delete form
[[redirects]]
  from   = "/api/delete-form"
  to     = ":VERCEL_API_URL/api/delete-form"
  status = 200
  force  = true

# Preview form
[[redirects]]
  from   = "/api/preview-form"
  to     = ":VERCEL_API_URL/api/preview-form"
  status = 200
  force  = true

# Form analytics
[[redirects]]
  from   = "/api/form-analytics"
  to     = ":VERCEL_API_URL/api/form-analytics"
  status = 200
  force  = true

# Response tracker
[[redirects]]
  from   = "/api/response-tracker"
  to     = ":VERCEL_API_URL/api/response-tracker"
  status = 200
  force  = true

# Rosters
[[redirects]]
  from   = "/api/rosters"
  to     = ":VERCEL_API_URL/api/rosters"
  status = 200
  force  = true

# Expected students
[[redirects]]
  from   = "/api/expected-students"
  to     = ":VERCEL_API_URL/api/expected-students"
  status = 200
  force  = true

# Form report
[[redirects]]
  from   = "/api/form-report"
  to     = ":VERCEL_API_URL/api/form-report"
  status = 200
  force  = true

# Overall review
[[redirects]]
  from   = "/api/overall-review"
  to     = ":VERCEL_API_URL/api/overall-review"
  status = 200
  force  = true

# Extract content
[[redirects]]
  from   = "/api/extract"
  to     = ":VERCEL_API_URL/api/extract"
  status = 200
  force  = true

# Drive import
[[redirects]]
  from   = "/api/drive-import"
  to     = ":VERCEL_API_URL/api/drive-import"
  status = 200
  force  = true

# Generate questions
[[redirects]]
  from   = "/api/generate"
  to     = ":VERCEL_API_URL/api/generate"
  status = 200
  force  = true

# Quiz endpoints
[[redirects]]
  from   = "/api/quiz/*"
  to     = ":VERCEL_API_URL/api/quiz/:splat"
  status = 200
  force  = true

# Catch-all for any other /api/* routes
[[redirects]]
  from   = "/api/*"
  to     = ":VERCEL_API_URL/api/:splat"
  status = 200
  force  = true

# ── SPA Fallback ─────────────────────────────────────────────
# All non-file, non-API routes serve index.html for React Router
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
