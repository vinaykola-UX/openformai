# ──────────────────────────────────────────────────────────────
# Netlify configuration for OpenForm Frontend
# Proxies API calls to Vercel (https://openformai.vercel.app) and
# serves the Vite SPA from dist/.
#
# Required Netlify Environment Variables (set in dashboard):
#   VITE_FIREBASE_API_KEY
#   VITE_FIREBASE_AUTH_DOMAIN
#   VITE_FIREBASE_PROJECT_ID
#   VITE_FIREBASE_STORAGE_BUCKET
#   VITE_FIREBASE_MESSAGING_SENDER_ID
#   VITE_FIREBASE_APP_ID
#   VITE_GOOGLE_IMPORT_API_URL   → Java backend URL (e.g. https://openform-import.onrender.com)
# ──────────────────────────────────────────────────────────────

[build]
  command   = "npm install && npm run build"
  publish   = "dist"

# ── API Proxies ──────────────────────────────────────────────
# All /api/* requests are reverse-proxied (200 rewrite) to Vercel.
# The browser sees them as same-origin — no CORS issues.
# Status 200 = invisible proxy (not a redirect).

# Google OAuth auth-url (Vercel serverless)
[[redirects]]
  from   = "/api/google/auth-url"
  to     = "https://openformai.vercel.app/api/google/auth-url"
  status = 200
  force  = true

# Google OAuth callback (Vercel serverless)
[[redirects]]
  from   = "/api/google/callback"
  to     = "https://openformai.vercel.app/api/google/callback"
  status = 200
  force  = true

# Unlock endpoint
[[redirects]]
  from   = "/api/unlock"
  to     = "https://openformai.vercel.app/api/unlock"
  status = 200
  force  = true

# Create form
[[redirects]]
  from   = "/api/create-form"
  to     = "https://openformai.vercel.app/api/create-form"
  status = 200
  force  = true

# Delete form
[[redirects]]
  from   = "/api/delete-form"
  to     = "https://openformai.vercel.app/api/delete-form"
  status = 200
  force  = true

# Preview form
[[redirects]]
  from   = "/api/preview-form"
  to     = "https://openformai.vercel.app/api/preview-form"
  status = 200
  force  = true

# Form analytics
[[redirects]]
  from   = "/api/form-analytics"
  to     = "https://openformai.vercel.app/api/form-analytics"
  status = 200
  force  = true

# Response tracker
[[redirects]]
  from   = "/api/response-tracker"
  to     = "https://openformai.vercel.app/api/response-tracker"
  status = 200
  force  = true

# Rosters
[[redirects]]
  from   = "/api/rosters"
  to     = "https://openformai.vercel.app/api/rosters"
  status = 200
  force  = true

# Expected students
[[redirects]]
  from   = "/api/expected-students"
  to     = "https://openformai.vercel.app/api/expected-students"
  status = 200
  force  = true

# Form report
[[redirects]]
  from   = "/api/form-report"
  to     = "https://openformai.vercel.app/api/form-report"
  status = 200
  force  = true

# Overall review
[[redirects]]
  from   = "/api/overall-review"
  to     = "https://openformai.vercel.app/api/overall-review"
  status = 200
  force  = true

# Extract content
[[redirects]]
  from   = "/api/extract"
  to     = "https://openformai.vercel.app/api/extract"
  status = 200
  force  = true

# Drive import
[[redirects]]
  from   = "/api/drive-import"
  to     = "https://openformai.vercel.app/api/drive-import"
  status = 200
  force  = true

# Generate questions
[[redirects]]
  from   = "/api/generate"
  to     = "https://openformai.vercel.app/api/generate"
  status = 200
  force  = true

# Quiz endpoints
[[redirects]]
  from   = "/api/quiz/*"
  to     = "https://openformai.vercel.app/api/quiz/:splat"
  status = 200
  force  = true

# Catch-all for any other /api/* routes
[[redirects]]
  from   = "/api/*"
  to     = "https://openformai.vercel.app/api/:splat"
  status = 200
  force  = true

# ── SPA Fallback ─────────────────────────────────────────────
# All non-file, non-API routes serve index.html for React Router
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
